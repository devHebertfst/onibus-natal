<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ônibus Natal — quanto falta pro seu ônibus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Os ônibus de Natal/RN andando no mapa em tempo real e quanto falta para o próximo chegar no seu ponto."
    />
    <meta name="theme-color" content="#c2410c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ônibus Natal" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <script>
      // Tema antes do primeiro quadro, para não piscar de claro para escuro.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('onibus-natal:tema');
        } catch (e) {}
        if (t !== 'dia' && t !== 'noite')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'noite' : 'dia';
        document.documentElement.dataset.tema = t;
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      [data-tema='noite'] body {
        background: #111416;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="icon.svg" width="96" height="96" alt="" />
    </div>
    <app-root></app-root>
  </body>
</html>
