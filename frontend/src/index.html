<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ônibus Natal — ao vivo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Ônibus de Natal/RN se movendo no mapa em tempo real, com previsão de chegada nas paradas."
    />
    <meta name="theme-color" content="#0a0808" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ônibus Natal" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <style>
      html,
      body {
        background: #0a0808;
        margin: 0;
      }
      #splash .palavra {
        color: #fff;
        font:
          650 22px/1 ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: -0.02em;
      }
      #splash .palavra span {
        color: #f4423e;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      #splash .sub {
        color: #c2c1c1;
        font:
          11px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #splash .pulso {
        animation: splash 2.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
      @keyframes splash {
        0% {
          transform: scale(1);
          opacity: 0.85;
        }
        100% {
          transform: scale(2.6);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 512 512" width="88" height="88">
        <rect width="512" height="512" rx="112" fill="#0a0808" stroke="#2a1c1a" stroke-width="12" />
        <circle
          class="pulso"
          cx="256"
          cy="256"
          r="56"
          fill="none"
          stroke="#e30613"
          stroke-width="8"
        />
        <circle
          cx="256"
          cy="256"
          r="100"
          fill="none"
          stroke="#e30613"
          stroke-width="12"
          stroke-opacity=".55"
        />
        <circle cx="256" cy="256" r="56" fill="#e30613" />
        <circle cx="256" cy="256" r="20" fill="#0a0808" />
      </svg>
      <div class="palavra">Ônibus<span>.natal</span></div>
      <div class="sub">ao vivo · natal/rn</div>
    </div>
    <app-root></app-root>
  </body>
</html>
