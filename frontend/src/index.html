<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ônibus Natal — quanto falta pro seu ônibus</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Os ônibus de Natal/RN andando no mapa em tempo real e quanto falta para o próximo chegar no seu ponto."
    />
    <meta name="theme-color" content="#00653a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ônibus Natal" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <script>
      // Tema antes do primeiro quadro, para não piscar de claro para escuro.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('onibus-natal:tema');
        } catch (e) {}
        if (t !== 'dia' && t !== 'noite')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'noite' : 'dia';
        document.documentElement.dataset.tema = t;
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      [data-tema='noite'] body {
        background: #15191b;
      }
      #splash .placa {
        position: relative;
        padding: 18px 26px;
        border-radius: 10px;
        background: #00653a;
        color: #fff;
        font:
          800 26px/1 system-ui,
          sans-serif;
        letter-spacing: -0.01em;
        box-shadow: 0 8px 24px rgb(0 0 0 / 22%);
      }
      #splash .placa::before {
        content: '';
        position: absolute;
        inset: 5px;
        border: 2px solid #fff;
        border-radius: 7px;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="placa">Ônibus Natal</div>
    </div>
    <app-root></app-root>
  </body>
</html>
