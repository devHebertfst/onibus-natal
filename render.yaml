services:
  - type: web
    name: onibus-natal-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/linhas
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Postgres do Neon (opcional): índice de paradas, catálogo e histórico.
      - key: DATABASE_URL
        sync: false
